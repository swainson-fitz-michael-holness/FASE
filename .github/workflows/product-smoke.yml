name: Product Smoke

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  product-smoke:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run product smoke
        run: |
          PYTHON_BIN=python BUILD_PYTHON=python RELEASE_BUNDLE_DIR=outputs/fase_release_bundle bash scripts/product_smoke.sh

      - name: Upload product handoff artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fase-product-${{ matrix.python-version }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*
            outputs/fase_release_bundle/*
